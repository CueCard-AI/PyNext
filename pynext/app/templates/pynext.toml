# PyNext Configuration
# ====================
# This file configures the PyNext AI App Builder.
# Place in your project root or ~/.config/pynext/config.toml for global settings.

# =============================================================================
# AI SETTINGS
# =============================================================================

[ai]
# AI model to use (claude-sonnet-4-20250514, claude-opus-4, etc.)
model = "claude-sonnet-4-20250514"

# Generation mode: plan (show plan first), agent (autonomous), ask (approve each file)
mode = "plan"

# Default complexity: auto, minimal, small, medium, large, enterprise
complexity = "auto"

# Maximum thought cycles for AI to attempt fixes
max_thoughts = 5

# Show AI's thinking process
verbose = false

# Response randomness (0.0 = deterministic, 1.0 = creative)
temperature = 0.7

# =============================================================================
# CODE STYLE
# =============================================================================

[style]
# Function and variable naming: snake_case, camelCase
naming_convention = "snake_case"

# Class naming: PascalCase, snake_case
class_naming = "PascalCase"

# Maximum line length
max_line_length = 88

# String quote style: double, single
quote_style = "double"

# Include trailing commas in multi-line structures
trailing_comma = true

# Docstring style: google, numpy, sphinx
docstring_style = "google"

# Spaces per indent level
indent_size = 4

# =============================================================================
# VALIDATION RULES
# =============================================================================

[validation]
# Require docstrings on all functions
require_docstrings = true

# Require type hints on all functions
require_type_hints = true

# Require test files for generated code
require_tests = false

# Maximum lines per function
max_function_lines = 50

# Maximum lines per file
max_file_lines = 500

# Imports that should never be used
forbidden_imports = ["os.system", "eval", "exec"]

# Imports that must be included (when applicable)
required_imports = []

# Code patterns that should never appear
forbidden_patterns = []

# =============================================================================
# TEAM STANDARDS
# =============================================================================

[team]
# Prefix for component names (e.g., "Acme" -> AcmeButton)
component_prefix = ""

# Header to include at the top of every file
file_header = """
# Generated by PyNext App Builder
"""

# Patterns that must be used when applicable
required_patterns = []

# Patterns that should never be used
forbidden_patterns = []

# =============================================================================
# PROMPTS
# =============================================================================

[prompts]
# System prompt prepended to ALL generations
system = """
You are an expert PyNext developer. Follow the project's coding standards strictly.
Write clean, maintainable, production-ready code.
"""

# Appended after every generation request
suffix = """
Remember:
- Use Tailwind CSS for styling
- Include proper accessibility attributes (aria-*)
- Handle loading and error states
"""

# Context about the project/domain (customize for your project)
context = ""

# Per-file-type prompts
[prompts.page]
prefix = "Pages should include SEO metadata and use the project layout."
suffix = ""

[prompts.island]
prefix = "Islands must be lightweight and include loading/error states."
suffix = ""

[prompts.api]
prefix = "All API routes should validate input and return consistent JSON."
suffix = "Return error format: {\"error\": string, \"code\": number}"

[prompts.model]
prefix = "Models should include created_at and updated_at timestamps."
suffix = ""

[prompts.action]
prefix = "Actions must validate all inputs before processing."
suffix = ""

[prompts.component]
prefix = "Components should be reusable and well-documented."
suffix = ""

# =============================================================================
# RULES
# =============================================================================

[rules]
# Freeform rules that always apply
custom = ""

[rules.always]
# Rules that are always included in prompts
custom = """
1. Use Tailwind CSS for all styling
2. Include aria labels for accessibility
3. Handle loading and error states appropriately
"""

# File naming conventions
[rules.naming]
pages = "{name}.py"        # pages/dashboard.py
components = "{Name}.py"   # components/UserCard.py
islands = "{Name}.py"      # islands/Counter.py
models = "{name}.py"       # models/user.py
api = "{name}.py"          # api/users.py

# Required project structure
[rules.structure]
required_dirs = ["pages", "components"]
required_files = []

# =============================================================================
# EXAMPLES (Few-shot learning for AI)
# =============================================================================

[examples]
# Good example of an island component
good_island = '''
from pynext import Signal, button, div
from pynext.islands import island

@island
def Counter():
    """A simple counter component with increment/decrement."""
    count = Signal(0)
    
    return div(class_="flex items-center gap-4")(
        button(
            class_="px-4 py-2 bg-blue-500 text-white rounded",
            on_click=lambda: count.set(count() - 1),
            aria_label="Decrement",
        )("-"),
        div(class_="text-2xl font-bold")(count),
        button(
            class_="px-4 py-2 bg-blue-500 text-white rounded",
            on_click=lambda: count.set(count() + 1),
            aria_label="Increment",
        )("+"),
    )
'''

# Bad example (what to avoid)
bad_island = '''
# BAD: Missing @island decorator, no types, inline styles, no accessibility
def counter():
    return div(style="color:red")(
        input()  # No label, no aria
    )
'''

# =============================================================================
# VARIABLES
# =============================================================================

[vars]
# Define reusable variables that can be used anywhere as ${var_name}
# company = "Acme Corp"
# year = 2025

# Computed variables (Python expressions)
# [vars.computed]
# copyright = "f'Copyright {year} {company}'"

# =============================================================================
# MODES
# =============================================================================

# Prototype mode - fast iteration, minimal validation
[mode.prototype]
description = "Fast iteration, minimal ceremony"
[mode.prototype.validation]
require_docstrings = false
require_type_hints = false
require_tests = false
[mode.prototype.prompts]
suffix = "Keep it simple and working. Skip edge cases for now."

# Production mode - full validation
[mode.production]
description = "Production-ready code with full validation"
[mode.production.validation]
require_docstrings = true
require_type_hints = true
require_tests = true
max_function_lines = 30
[mode.production.prompts]
suffix = """
This is production code. Include:
- Comprehensive error handling
- Input validation
- Logging
- Performance considerations
"""

# Strict mode - maximum safety
[mode.strict]
description = "Maximum safety and security"
extends = "production"
[mode.strict.validation]
forbidden_imports = ["os.system", "eval", "exec", "subprocess.shell"]
[mode.strict.prompts]
system = """
STRICT MODE: Security is paramount.
- Never trust user input
- Always sanitize and validate
- Use parameterized queries only
- Log all sensitive operations
"""

# =============================================================================
# CONDITIONAL PROMPTS
# =============================================================================

# Conditionals are applied when their conditions match.
# Use `when` for Python expressions, `when_llm` for natural language.
# Higher priority values are applied first.

# Example: API endpoints with authentication
# [[conditional]]
# priority = 80
# when = "file_type == 'api'"
# prompt = "All API endpoints must validate input and handle errors."

# Example: Payment-related features
# [[conditional]]
# priority = 90
# when_llm = "the user is building payment or financial functionality"
# prompt = """
# PAYMENT HANDLING:
# - Use Decimal for money, never float
# - Implement audit trails
# - Consider PCI compliance
# """

# =============================================================================
# PATTERNS
# =============================================================================

# Define reusable code patterns with ${variable} placeholders.

# Example: Standard API endpoint
# [patterns.api_endpoint]
# description = "Standard API endpoint with validation"
# tags = ["api"]
# when = "file_type == 'api'"
# code = '''
# from pynext.api import api, Request, Response
# 
# @api
# async def ${method}(request: Request):
#     """${description}"""
#     ${body}
# '''

# =============================================================================
# MEMORY SETTINGS
# =============================================================================

[memory]
# Sync mode: incremental (append), full (rewrite), manual (no auto)
sync_mode = "incremental"

# When to auto-sync: assistant_response, user_input, checkpoint, exit, error
sync_on = ["assistant_response", "checkpoint", "exit"]

# Seconds between syncs (0 = disabled)
sync_interval = 0

# Buffer this many entries before writing
sync_batch_size = 5

# What to sync
sync_entries = true
sync_summaries = true
sync_checkpoints = true
sync_preferences = true

# Filtering
exclude_roles = []
min_content_length = 0
max_entries_in_memory = 1000

# File management
max_file_size_mb = 50
rotate_files = true
max_rotated_files = 5

# Compression
compress_on_sync = false
compress_threshold_mb = 10

