name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install anthropic  # For AI generator tests
      
      - name: Run unit tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        timeout-minutes: 15
        run: |
          pytest tests/unit -v --tb=short --timeout=60
      
      - name: Run integration tests
        timeout-minutes: 10
        run: |
          pytest tests/integration -v --tb=short --timeout=60 --ignore=tests/integration/db --ignore=tests/integration/dataframe
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            htmlcov/

  coverage:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install anthropic  # For AI generator tests
      
      - name: Run tests with coverage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        timeout-minutes: 20
        run: |
          pytest tests/unit tests/integration --cov=pynext --cov-report=xml --cov-report=html --timeout=60
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # Database integration tests with PostgreSQL
  db-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pynext
          POSTGRES_PASSWORD: pynext
          POSTGRES_DB: pynext_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U pynext -d pynext_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Build Go bridge
        run: |
          cd go
          go build -buildmode=c-shared -o ../pynext_go/_lib/linux_amd64/libpynext.so ./cmd/pynext/main.go
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db]"
          pip install psycopg[binary,pool]
      
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5433 -U pynext && break
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
      
      - name: Run database and dataframe tests
        env:
          PYNEXT_TEST_DB_URL: postgresql://pynext:pynext@localhost:5433/pynext_test
          DATABASE_URL: postgresql://pynext:pynext@localhost:5433/pynext_test
          TEST_DATABASE_URL: postgresql://pynext:pynext@localhost:5433/pynext_test
        timeout-minutes: 15
        run: |
          pytest tests/unit/test_go_*.py tests/integration/db tests/integration/dataframe -v --tb=short --timeout=60
      
      - name: Run Go tests
        run: |
          cd go
          go test ./... -v -timeout=60s

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      
      - name: Run benchmarks
        run: |
          pytest tests/benchmarks -v --benchmark-only --benchmark-json=benchmark-results.json
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      
      - name: Check formatting with Black
        run: |
          black --check pynext tests
        continue-on-error: true
      
      - name: Lint with Ruff
        run: |
          ruff check pynext tests
        continue-on-error: true

  js-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: tests/js/package.json
      
      - name: Install JS test dependencies
        working-directory: tests/js
        run: |
          npm install
      
      - name: Run JS tests
        working-directory: tests/js
        run: |
          npm test -- --coverage
      
      - name: Upload JS coverage
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: tests/js/coverage/

  bundle-size:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Check bundle size
        run: |
          node scripts/check-bundle-size.js
      
      - name: Report sizes
        if: always()
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node scripts/check-bundle-size.js 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps
      
      - name: Run E2E tests
        run: |
          pytest tests/e2e -v --timeout=120
        continue-on-error: true
