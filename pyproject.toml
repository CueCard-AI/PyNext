[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynext"
version = "0.1.0"
description = "A Python alternative to Next.js with SolidJS-inspired reactivity"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "PyNext Contributors" }
]
keywords = ["web", "framework", "reactive", "frontend", "fullstack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "watchfiles>=0.21.0",
    "orjson>=3.9.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "pytest-timeout>=2.2.0",
    "httpx>=0.25.0",
    "playwright>=1.40.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "python-dotenv>=1.0.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "pytest-timeout>=2.2.0",
    "httpx>=0.25.0",
]

e2e = [
    "playwright>=1.40.0",
]

# PostgreSQL support
postgres = [
    "asyncpg>=0.29.0",
]

# All database features
db = [
    "asyncpg>=0.29.0",
]

[project.scripts]
pynext = "pynext.cli:main"

[project.urls]
Homepage = "https://github.com/pynext/pynext"
Documentation = "https://pynext.dev"
Repository = "https://github.com/pynext/pynext"

[tool.hatch.build.targets.wheel]
packages = ["pynext"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Default timeout of 60 seconds per test - prevents stuck tests
# AI generation tests may take 30-40s, so we use 60s as default
timeout = 60
# Method to use for timeout (signal is more reliable on Unix)
timeout_method = "signal"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    # Show test durations for the 10 slowest tests
    "--durations=10",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as end-to-end browser tests",
    "benchmark: marks tests as performance benchmarks",
    "timeout: override default timeout for a specific test",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["pynext"]
branch = true
omit = [
    "pynext/__main__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 55
show_missing = true

